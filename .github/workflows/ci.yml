name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,observability]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Check dashboard JavaScript
        run: node --check ../frontend/app.js

      - name: Check integration scripts
        run: ruff check ../deploy/start.py ../scripts ../examples

  containers:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build services
        run: docker compose build
      - name: Build single-container deployment
        run: docker build --file deploy/Dockerfile --tag driftzero-deploy:test .
      - name: Start stack
        run: |
          docker compose up --detach

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/healthz >/dev/null \
              && curl --fail --silent http://localhost:3000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API and dashboard did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done

          for service in alert-worker recovery-worker retention-worker; do
            if [ "$(docker compose ps --status running --services "$service")" != "$service" ]; then
              echo "$service is not running" >&2
              exit 1
            fi
          done
      - name: Verify dashboard and recovery flow
        run: python scripts/smoke_test.py --base-url http://localhost:3000
      - name: Verify single-container deployment
        run: |
          docker run --detach --name driftzero-deploy-test --env PORT=10000 --publish 3100:10000 driftzero-deploy:test
          python scripts/smoke_test.py --base-url http://localhost:3100
      - name: Print logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: |
          container_id=$(docker ps --all --quiet --filter name=^driftzero-deploy-test$)
          if [ -n "$container_id" ]; then
            docker rm --force "$container_id"
          fi
          docker compose down --volumes
