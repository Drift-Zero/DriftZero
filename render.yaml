databases:
  - name: driftzero-db
    plan: free
    region: singapore
    databaseName: driftzero
    user: driftzero

services:
  - type: web
    name: driftzero-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: DRIFTZERO_ENVIRONMENT
        value: hackathon-demo
      - key: DRIFTZERO_DATABASE_URL
        fromDatabase:
          name: driftzero-db
          property: connectionString
      - key: DRIFTZERO_API_PREFIX
        value: /api/v1
      - key: DRIFTZERO_API_REQUIRE_AUTH
        value: "false"
      - key: DRIFTZERO_API_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: DRIFTZERO_API_MAX_REQUEST_BYTES
        value: "1048576"
      - key: DRIFTZERO_TRUSTED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DRIFTZERO_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DRIFTZERO_LOG_LEVEL
        value: INFO
      - key: DRIFTZERO_RECOVERY_WORKER_INTERVAL_SECONDS
        value: "1"
      - key: DRIFTZERO_RECOVERY_ALLOW_LOCAL_IDENTITY
        value: "true"
      - key: DRIFTZERO_OTEL_ENABLED
        value: "false"
      - key: DRIFTZERO_GROQ_API_KEY
        sync: false
      - key: DRIFTZERO_GROQ_TIMEOUT_SECONDS
        value: "15"
