services:
  - type: web
    name: driftzero-demo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy backend routes with every main-branch commit. Waiting for the
    # repository-wide CI check allowed Vercel to advance while this service
    # remained on an older API contract.
    autoDeployTrigger: commit
    envVars:
      - key: DRIFTZERO_ENVIRONMENT
        value: hackathon-demo
      # The hackathon demo uses the SQLite default baked into deploy/Dockerfile.
      # Render permits only one free PostgreSQL database per workspace, and this
      # workspace's existing database belongs to another application. Replace
      # this with a managed DRIFTZERO_DATABASE_URL for persistent production data.
      - key: DRIFTZERO_DATABASE_URL
        value: sqlite:////tmp/driftzero.db
      - key: DRIFTZERO_API_PREFIX
        value: /api/v1
      - key: DRIFTZERO_API_REQUIRE_AUTH
        value: "false"
      - key: DRIFTZERO_API_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: DRIFTZERO_API_MAX_REQUEST_BYTES
        value: "8388608"
      - key: DRIFTZERO_EVIDENCE_MAX_FILE_BYTES
        value: "5242880"
      - key: DRIFTZERO_EVIDENCE_URL_TIMEOUT_SECONDS
        value: "15"
      - key: DRIFTZERO_EVIDENCE_SYNC_INTERVAL_SECONDS
        value: "60"
      - key: DRIFTZERO_WEBSITE_REFRESH_INTERVAL_SECONDS
        value: "30"
      - key: DRIFTZERO_WEBSITE_FETCH_TIMEOUT_SECONDS
        value: "15"
      - key: DRIFTZERO_WEBSITE_LLM_TIMEOUT_SECONDS
        value: "45"
      - key: DRIFTZERO_WEBSITE_MAX_RESPONSE_BYTES
        value: "1048576"
      - key: DRIFTZERO_WEBSITE_LLM_TEXT_CHARS
        value: "40000"
      - key: XAI_API_KEY
        sync: false
      - key: DRIFTZERO_XAI_MODEL
        value: grok-4.6
      - key: DRIFTZERO_XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: DRIFTZERO_TRUSTED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DRIFTZERO_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DRIFTZERO_LOG_LEVEL
        value: INFO
      - key: DRIFTZERO_RECOVERY_WORKER_INTERVAL_SECONDS
        value: "1"
      - key: DRIFTZERO_RECOVERY_ALLOW_LOCAL_IDENTITY
        value: "true"
      - key: DRIFTZERO_OTEL_ENABLED
        value: "false"
      - key: DRIFTZERO_GROQ_API_KEY
        sync: false
      - key: DRIFTZERO_GROQ_TIMEOUT_SECONDS
        value: "15"
