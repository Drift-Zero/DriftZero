name: driftzero

x-backend-environment: &backend-environment
  DRIFTZERO_DATABASE_URL: ${DRIFTZERO_DATABASE_URL:-sqlite:////data/driftzero.db}
  DRIFTZERO_API_PREFIX: ${DRIFTZERO_API_PREFIX:-/api/v1}
  DRIFTZERO_ENVIRONMENT: ${DRIFTZERO_ENVIRONMENT:-development}
  DRIFTZERO_MINIMUM_SAMPLE_SIZE: ${DRIFTZERO_MINIMUM_SAMPLE_SIZE:-20}
  DRIFTZERO_MINIMUM_COVERAGE: ${DRIFTZERO_MINIMUM_COVERAGE:-0.30}
  DRIFTZERO_FORECAST_HORIZON_MINUTES: ${DRIFTZERO_FORECAST_HORIZON_MINUTES:-30}
  DRIFTZERO_ALERT_EVALUATION_INTERVAL_SECONDS: ${DRIFTZERO_ALERT_EVALUATION_INTERVAL_SECONDS:-60}
  DRIFTZERO_RECOVERY_WORKER_INTERVAL_SECONDS: ${DRIFTZERO_RECOVERY_WORKER_INTERVAL_SECONDS:-2}
  DRIFTZERO_RECOVERY_COMMAND_LEASE_SECONDS: ${DRIFTZERO_RECOVERY_COMMAND_LEASE_SECONDS:-60}
  DRIFTZERO_RECOVERY_COMMAND_MAX_ATTEMPTS: ${DRIFTZERO_RECOVERY_COMMAND_MAX_ATTEMPTS:-3}
  DRIFTZERO_RECOVERY_ALLOW_LOCAL_IDENTITY: ${DRIFTZERO_RECOVERY_ALLOW_LOCAL_IDENTITY:-true}
  DRIFTZERO_RECOVERY_OPERATOR_API_KEY: ${DRIFTZERO_RECOVERY_OPERATOR_API_KEY:-}
  DRIFTZERO_RECOVERY_ADMIN_API_KEY: ${DRIFTZERO_RECOVERY_ADMIN_API_KEY:-}
  DRIFTZERO_RECOVERY_CONTROL_URL: ${DRIFTZERO_RECOVERY_CONTROL_URL:-}
  DRIFTZERO_RECOVERY_CONTROL_TOKEN: ${DRIFTZERO_RECOVERY_CONTROL_TOKEN:-}
  DRIFTZERO_RECOVERY_VERIFICATION_REQUESTS: ${DRIFTZERO_RECOVERY_VERIFICATION_REQUESTS:-50}
  DRIFTZERO_RECOVERY_VERIFICATION_COVERAGE: ${DRIFTZERO_RECOVERY_VERIFICATION_COVERAGE:-0.90}
  # ShopAssist reaches the API by its Compose service name. Keep that internal
  # hostname explicit so TrustedHostMiddleware does not reject telemetry.
  DRIFTZERO_TRUSTED_HOSTS: ${DRIFTZERO_TRUSTED_HOSTS:-localhost,127.0.0.1,testserver,api}
  DRIFTZERO_CONNECTION_SECRET_KEY: ${DRIFTZERO_CONNECTION_SECRET_KEY:-}
  DRIFTZERO_CONNECTION_CHECK_TIMEOUT_SECONDS: ${DRIFTZERO_CONNECTION_CHECK_TIMEOUT_SECONDS:-8}
  DRIFTZERO_RETENTION_INTERVAL_SECONDS: ${DRIFTZERO_RETENTION_INTERVAL_SECONDS:-3600}
  DRIFTZERO_LOG_LEVEL: ${DRIFTZERO_LOG_LEVEL:-INFO}
  DRIFTZERO_SLOW_QUERY_MS: ${DRIFTZERO_SLOW_QUERY_MS:-250}
  DRIFTZERO_OTEL_ENABLED: ${DRIFTZERO_OTEL_ENABLED:-false}
  DRIFTZERO_OTEL_SERVICE_NAME: ${DRIFTZERO_OTEL_SERVICE_NAME:-driftzero-api}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  networks:
    - driftzero

services:
  api:
    <<: *service-defaults
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      PORT: 8000
    ports:
      - "${DRIFTZERO_API_PORT:-8000}:8000"
    volumes:
      - driftzero-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  alert-worker:
    <<: *service-defaults
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.alert_worker"]
    environment:
      <<: *backend-environment
    volumes:
      - driftzero-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]

  recovery-worker:
    <<: *service-defaults
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.recovery_worker"]
    environment:
      <<: *backend-environment
    volumes:
      - driftzero-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]

  retention-worker:
    <<: *service-defaults
    build:
      context: ./backend
    entrypoint: ["python", "-m", "app.retention_worker"]
    environment:
      <<: *backend-environment
    volumes:
      - driftzero-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["NONE"]

  dashboard:
    <<: *service-defaults
    build:
      context: ./frontend
    environment:
      DRIFTZERO_API_UPSTREAM: http://api:8000
    ports:
      - "${DRIFTZERO_DASHBOARD_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  shop-assist:
    <<: *service-defaults
    build:
      context: ./shop-assist
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DRIFTZERO_API_URL: http://api:8000
      SHOPASSIST_PUBLIC_URL: ${SHOPASSIST_PUBLIC_URL:-http://localhost:3100}
    ports:
      - "${SHOP_ASSIST_PORT:-3100}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

volumes:
  driftzero-data:

networks:
  driftzero:
    driver: bridge
